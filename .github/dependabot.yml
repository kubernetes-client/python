version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
    # requirements.txt is the install_requires of a published library, so
    # widen ranges instead of raising lower bounds on every new release.
    versioning-strategy: "widen"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
