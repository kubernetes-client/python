[tox]
envlist =
   py3{10,11,12,13,14}
   py3{10,11,12,13,14}-functional

[testenv]
passenv = TOXENV,CI,TRAVIS,TRAVIS_*
usedevelop = True
install_command = pip install -U {opts} {packages}
deps = -r{toxinidir}/test-requirements.txt
       -r{toxinidir}/requirements.txt
       -r{toxinidir}/requirements-asyncio.txt
       -r{toxinidir}/test-requirements-asyncio.txt
commands =
   python -V
   !functional: pytest -vvv -s {env:_TOX_COVERAGE_RUN:} --ignore=kubernetes/e2e_test --ignore=kubernetes/aio/e2e_test
   functional: {toxinidir}/scripts/kube-init.sh pytest -vvv -s []
   coverage: python -m coverage xml
setenv =
   coverage: _TOX_COVERAGE_RUN=--cov=kubernetes/watch --cov=kubernetes/config

[testenv:docs]
allowlist_externals = make
deps =
   {[testenv]deps}
   -r{toxinidir}/doc/requirements-docs.txt
commands =
   make -C doc html

[testenv:update-pycodestyle]
commands =
   {toxinidir}/scripts/update-pycodestyle.sh
